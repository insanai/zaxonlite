# Release workflow for zaxonlite (insanai/zaxonlite).
#
# One Ubuntu job cross-compiles the self-contained `zaxon` CLI for Linux,
# Windows, and macOS with Zig. Native Linux, macOS, and Windows jobs build
# the `cp312-abi3` Python wheels, repair platform metadata where needed,
# and test the installed artifacts before a separate job can publish them.
#
# Cut a release by pushing the version declared in build.zig.zon:
#   git tag v0.6.0 && git push origin v0.6.0
# Before tagging, bump `.version` in build.zig.zon and the library version
# string so `zaxon version` reports the tag.
#
# Linux binaries target musl, so they are fully static and run on any
# distribution. Windows binaries need Windows 10 1809 or Server 2019 and
# newer, on NTFS: the storage layer relies on POSIX rename semantics and on
# the NTFS metadata log, and `zaxon` refuses to start where they are
# missing. Unix socket listeners are POSIX-only.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry runs build the archives without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0
  OPENSSL_VERSION: 3.5.0

jobs:
  cli:
    name: Cross-compile CLI
    runs-on: ubuntu-latest
    steps:
      # The `.path = ".."` paxos dependency resolves when paxos-zig sits at
      # the workspace root with this repository in zaxonlite/ beside it.
      # While insanai/paxos-zig is private, add a CROSS_REPO_TOKEN secret
      # (fine-grained PAT with read access to it); once public, the
      # default token fallback is enough.
      - name: Checkout paxos-zig (path dependency parent)
        uses: actions/checkout@v4
        with:
          repository: insanai/paxos-zig
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          ref: main
          path: .

      - name: Checkout zaxonlite
        uses: actions/checkout@v4
        with:
          path: zaxonlite

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: zaxonlite
        run: |
          set -eu
          expected="${GITHUB_REF_NAME#v}"
          package_version="$(awk -F'"' '/\.version =/{print $2; exit}' build.zig.zon)"
          library_version="$(awk -F'"' '/pub const version =/{print $2; exit}' src/root.zig)"
          paxos_version="$(awk -F'"' '/\.version =/{print $2; exit}' ../build.zig.zon)"
          paxos_library_version="$(awk -F'"' '/pub const version =/{print $2; exit}' ../src/root.zig)"
          test "${package_version}" = "${expected}"
          test "${library_version}" = "${expected}"
          test -n "${paxos_version}"
          test -n "${paxos_library_version}"

      # Zig's zip fetch (the SQLite amalgamation) writes its temporary file
      # under the global cache's tmp/ directory but does not create it.
      - name: Prepare Zig package cache
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"

      # Fetch once, with retries, so a transient DNS or mirror failure
      # cannot abort the cross-compile loop halfway through.
      - name: Fetch package dependencies
        working-directory: zaxonlite
        run: |
          for attempt in 1 2 3 4 5; do
            zig build --fetch && exit 0
            echo "fetch attempt ${attempt} failed; retrying"
            sleep 15
          done
          exit 1

      # restore/save are split so a packaging failure later in the job
      # still preserves the expensive OpenSSL builds for the next attempt.
      - name: Restore cross-compiled OpenSSL
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: openssl-dist
          key: openssl-${{ env.OPENSSL_VERSION }}-zig${{ env.ZIG_VERSION }}-v3

      - name: Build static OpenSSL for every target
        id: openssl-build
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xf "openssl-${OPENSSL_VERSION}.tar.gz"
          build_openssl() {
            zig_target="$1"; openssl_target="$2"
            src="openssl-build-${zig_target}"
            rm -rf "$src"
            cp -R "openssl-${OPENSSL_VERSION}" "$src"
            (
              cd "$src"
              # --libdir=lib: OpenSSL otherwise installs into lib64/ on
              # 64-bit Linux targets, where -Dopenssl-prefix will not look.
              ./Configure "$openssl_target" \
                no-shared no-apps no-tests no-docs no-legacy \
                --prefix="${GITHUB_WORKSPACE}/openssl-dist/${zig_target}" \
                --libdir=lib \
                CC="zig cc -target ${zig_target}" \
                AR="zig ar" RANLIB="zig ranlib"
              make -j"$(nproc)" build_libs
              make install_dev
            )
            rm -rf "$src"
            ls "${GITHUB_WORKSPACE}/openssl-dist/${zig_target}/lib"
          }
          build_openssl x86_64-linux-musl   linux-x86_64
          build_openssl aarch64-linux-musl  linux-aarch64
          build_openssl x86_64-macos        darwin64-x86_64-cc
          build_openssl aarch64-macos       darwin64-arm64-cc
          build_openssl x86_64-windows-gnu  mingw64

      - name: Save cross-compiled OpenSSL
        if: always() && steps.openssl-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: openssl-dist
          key: openssl-${{ env.OPENSSL_VERSION }}-zig${{ env.ZIG_VERSION }}-v3

      - name: Cross-compile zaxon for every target
        working-directory: zaxonlite
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ../release
          package() {
            zig_target="$1"; exe="$2"
            zig build -Dtarget="${zig_target}" -Doptimize=ReleaseSafe \
              -Dopenssl-prefix="${GITHUB_WORKSPACE}/openssl-dist/${zig_target}" \
              --prefix "zig-out/${zig_target}"
            staging="zaxon-${version}-${zig_target}"
            rm -rf "$staging"
            mkdir "$staging"
            cp "zig-out/${zig_target}/bin/${exe}" "$staging/"
            cp README.md LICENSE "$staging/"
            case "$exe" in
              *.exe) zip -r "../release/${staging}.zip" "$staging" ;;
              *)     tar czf "../release/${staging}.tar.gz" "$staging" ;;
            esac
            rm -rf "$staging"
          }
          package x86_64-linux-musl  zaxon
          package aarch64-linux-musl zaxon
          package x86_64-macos       zaxon
          package aarch64-macos      zaxon
          package x86_64-windows-gnu zaxon.exe

      - name: Upload CLI archives
        uses: actions/upload-artifact@v4
        with:
          name: zaxon-cli
          path: release/*
          if-no-files-found: error

  python-linux:
    name: Python wheel (manylinux2014 x86-64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout paxos-zig (path dependency parent)
        uses: actions/checkout@v4
        with:
          repository: insanai/paxos-zig
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          ref: main
          path: .

      - name: Checkout zaxonlite
        uses: actions/checkout@v4
        with:
          path: zaxonlite

      # Run only the compiler toolchain in the old-glibc container. GitHub
      # JavaScript actions use Node 24 and therefore execute on the host.
      - name: Build, repair, and test wheel in manylinux2014
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/zaxonlite/languages/python \
            --env OPENSSL_VERSION \
            --env ZIG_VERSION \
            --env GITHUB_REF_NAME \
            quay.io/pypa/manylinux2014_x86_64:latest \
            bash -euxo pipefail -c '
              cd /tmp
              curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
              tar xf "zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
              export PATH="/tmp/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
              export ZIG_GLOBAL_CACHE_DIR=/tmp/zig-cache
              mkdir -p /tmp/zig-cache/tmp

              yum install -y perl-IPC-Cmd
              curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
              tar xf "openssl-${OPENSSL_VERSION}.tar.gz"
              cd "openssl-${OPENSSL_VERSION}"
              ./Configure linux-x86_64 \
                no-shared no-apps no-tests no-docs no-legacy \
                --prefix=/tmp/openssl-python --libdir=lib
              make -j"$(nproc)" build_libs
              make install_dev

              cd /workspace/zaxonlite/languages/python
              export ZXLITE_OPENSSL_PREFIX=/tmp/openssl-python
              export ZXLITE_ZIG_TARGET=x86_64-linux-gnu.2.17
              python=/opt/python/cp312-cp312/bin/python
              "$python" -m pip install "setuptools>=77" build auditwheel
              "$python" -m build --wheel --no-isolation --outdir dist
              auditwheel repair --plat manylinux2014_x86_64 \
                --wheel-dir wheelhouse dist/*.whl
              test "$(find wheelhouse -maxdepth 1 -name "*cp312-abi3-manylinux2014_x86_64*.whl" | wc -l)" -eq 1
              "$python" -m venv /tmp/zxlite-wheel-test
              /tmp/zxlite-wheel-test/bin/pip install wheelhouse/*.whl
              version="${GITHUB_REF_NAME#v}"
              /tmp/zxlite-wheel-test/bin/python -c \
                "import zxlite; assert zxlite.__version__ == \"${version}\""
            '

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: zxlite-wheel-linux-x86_64
          path: zaxonlite/languages/python/wheelhouse/*.whl
          if-no-files-found: error

  python-macos:
    name: Python wheel (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel
            deployment_target: "10.15"
            wheel_platform: macosx_10_15_x86_64
          - arch: arm64
            os: macos-14
            deployment_target: "11.0"
            wheel_platform: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zaxonlite/languages/python
    steps:
      - name: Checkout paxos-zig (path dependency parent)
        uses: actions/checkout@v4
        with:
          repository: insanai/paxos-zig
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          ref: main
          path: .

      - name: Checkout zaxonlite
        uses: actions/checkout@v4
        with:
          path: zaxonlite

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare native build environment
        run: |
          mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
          echo "ZXLITE_OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          python -m pip install "setuptools>=77" build delocate wheel

      - name: Build and repair wheel
        env:
          ARCHFLAGS: -arch ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          set -eux
          python -m build --wheel --no-isolation --outdir dist
          # GitHub's framework Python reports universal2 even when
          # ARCHFLAGS produced the single-architecture binary above.
          python -m wheel tags \
            --platform-tag "${{ matrix.wheel_platform }}" \
            --remove dist/*.whl
          python -m delocate.cmd.delocate_wheel \
            --wheel-dir wheelhouse dist/*.whl
          test "$(find wheelhouse -maxdepth 1 -name "*cp312-abi3-macosx*_${{ matrix.arch }}.whl" | wc -l)" -eq 1

      - name: Test installed wheel
        run: |
          set -eux
          python -m venv /tmp/zxlite-wheel-test
          /tmp/zxlite-wheel-test/bin/pip install wheelhouse/*.whl
          version="${GITHUB_REF_NAME#v}"
          /tmp/zxlite-wheel-test/bin/python -c \
            "import zxlite; assert zxlite.__version__ == '${version:-0.6.0}'"

      - name: Upload macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: zxlite-wheel-macos-${{ matrix.arch }}
          path: zaxonlite/languages/python/wheelhouse/*.whl
          if-no-files-found: error

  python-windows:
    name: Python wheel (Windows x86-64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zaxonlite/languages/python
    steps:
      - name: Checkout paxos-zig (path dependency parent)
        uses: actions/checkout@v4
        with:
          repository: insanai/paxos-zig
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          ref: main
          path: .

      - name: Checkout zaxonlite
        uses: actions/checkout@v4
        with:
          path: zaxonlite

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare native build environment
        shell: pwsh
        run: |
          $cache = if ($env:ZIG_GLOBAL_CACHE_DIR) {
            $env:ZIG_GLOBAL_CACHE_DIR
          } else {
            Join-Path $env:LOCALAPPDATA "zig"
          }
          New-Item -ItemType Directory -Force (Join-Path $cache "tmp")
          $triplet = "x64-windows-static"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "openssl:$triplet"
          $prefix = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
          "ZXLITE_OPENSSL_PREFIX=$prefix" >> $env:GITHUB_ENV
          python -m pip install "setuptools>=77" build wheel

      - name: Build wheel
        shell: pwsh
        run: |
          python -m build --wheel --no-isolation --outdir wheelhouse
          $wheels = @(Get-ChildItem wheelhouse\*cp312-abi3-win_amd64.whl)
          if ($wheels.Count -ne 1) {
            throw "expected one cp312-abi3 win_amd64 wheel; found $($wheels.Count)"
          }

      - name: Test installed wheel
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\zxlite-wheel-test"
          $wheel = (Get-ChildItem wheelhouse\*.whl).FullName
          & "$env:RUNNER_TEMP\zxlite-wheel-test\Scripts\pip.exe" install $wheel
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.6.0" }
          & "$env:RUNNER_TEMP\zxlite-wheel-test\Scripts\python.exe" -c `
            "import zxlite; assert zxlite.__version__ == '$version'"

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: zxlite-wheel-windows-x86_64
          path: zaxonlite/languages/python/wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cli, python-linux, python-macos, python-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            zaxonlite 0.6.0 introduces lifetime-global Paxos slots, a bounded
            reusable consensus window, continuous segmented-journal trimming,
            durable state anchors, and beyond-retention replica transfer.

            This release includes self-contained `zaxon` CLI archives and
            CPython 3.12+ Stable ABI wheels for Linux x86-64, macOS, and
            Windows x86-64.
          generate_release_notes: true

  pypi:
    name: Publish zxlite to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@v4
        with:
          pattern: zxlite-wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
