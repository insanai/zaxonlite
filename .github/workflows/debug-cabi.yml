# Temporary debugging workflow: the C ABI smoke test hangs on Linux.
# Runs test-cabi under strace with a hard timeout and prints the tail of
# the trace, which shows the last checks that ran (write() calls to
# stdout) and the syscall every thread is blocked in. Delete this file
# once the hang is fixed.
name: Debug C ABI hang

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zaxonlite
    steps:
      - name: Checkout paxos-zig (path dependency parent)
        uses: actions/checkout@v4
        with:
          repository: insanai/paxos-zig
          path: .

      - name: Checkout zaxonlite
        uses: actions/checkout@v4
        with:
          path: zaxonlite

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install OpenSSL 3, strace, and gdb
        run: sudo apt-get update && sudo apt-get install -y libssl-dev strace gdb

      - name: Prepare Zig package cache
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"

      - name: Build the smoke test without running it
        run: zig build check

      - name: Run test-cabi, then take stacks of the hung smoke process
        run: |
          set -x
          zig build test-cabi & BUILD_PID=$!
          sleep 120
          SMOKE_PID=$(pgrep -f zaxon-capi-smoke | head -1 || true)
          if [ -z "$SMOKE_PID" ]; then
            echo "smoke process not found; build may have finished"
            wait $BUILD_PID || echo "build exit=$?"
            exit 0
          fi
          echo "=== thread states (R=spinning, S=waiting) ==="
          for t in /proc/$SMOKE_PID/task/*; do
            printf '%s state=%s wchan=%s utime=%s\n' \
              "$(basename "$t")" \
              "$(awk '{print $3}' "$t/stat")" \
              "$(cat "$t/wchan" 2>/dev/null)" \
              "$(awk '{print $14}' "$t/stat")"
          done
          echo "=== gdb: all thread backtraces ==="
          sudo gdb -p "$SMOKE_PID" -batch \
            -ex 'set pagination off' \
            -ex 'thread apply all bt 12' 2>&1 | tail -n 150
          kill -9 "$SMOKE_PID" || true
          kill "$BUILD_PID" || true
